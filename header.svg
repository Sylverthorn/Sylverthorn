<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" width="100%" height="100%">
  <defs>
    
    <pattern id="dotGrid" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#1D1D1D" />
    </pattern>
    
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#FFFFFF" fill-opacity="0.02" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .blink { animation: blink 1s steps(2, start) infinite; }
    .led-1 { animation: ledPulse 1.4s steps(2, start) infinite; }
    .led-2 { animation: ledPulse 2.1s steps(2, start) infinite 0.4s; }
    .led-3 { animation: ledPulse 1.7s steps(2, start) infinite 0.9s; }
    .port-1 { animation: portScan 2.4s steps(1, end) infinite 0s; }
    .port-2 { animation: portScan 2.4s steps(1, end) infinite 0.6s; }
    .port-3 { animation: portScan 2.4s steps(1, end) infinite 1.2s; }
    .port-4 { animation: portScan 2.4s steps(1, end) infinite 1.8s; }
    .pkt-1 { animation: routeTop 3.2s steps(10, end) infinite; }
    .pkt-2 { animation: routeBottom 3.8s steps(10, end) infinite 1.1s; }
    .pkt-3 { animation: routeTop 3.2s steps(10, end) infinite 1.6s; }
    .code-bar { animation: codeType 2.6s steps(6, end) infinite; }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes ledPulse {
      0% { fill: #FFFFFF; }
      50% { fill: #404040; }
      100% { fill: #FFFFFF; }
    }
    @keyframes portScan {
      0%, 24% { fill: #FFFFFF; }
      25%, 100% { fill: #333333; }
    }
    @keyframes codeType {
      0% { width: 8px; }
      50% { width: 32px; }
      100% { width: 8px; }
    }
    @keyframes routeTop {
      0%   { transform: translate(0px, 0px); opacity: 0; }
      5%   { transform: translate(0px, 0px); opacity: 1; }
      40%  { transform: translate(65px, 0px); opacity: 1; }
      65%  { transform: translate(65px, 35px); opacity: 1; }
      95%  { transform: translate(128px, 35px); opacity: 1; }
      100% { transform: translate(128px, 35px); opacity: 0; }
    }
    @keyframes routeBottom {
      0%   { transform: translate(0px, 0px); opacity: 0; }
      5%   { transform: translate(0px, 0px); opacity: 1; }
      35%  { transform: translate(-63px, 0px); opacity: 1; }
      65%  { transform: translate(-63px, 34px); opacity: 1; }
      95%  { transform: translate(-128px, 34px); opacity: 1; }
      100% { transform: translate(-128px, 34px); opacity: 0; }
    }
  </style>

  
  <rect x="0.5" y="0.5" width="839" height="219" fill="#0A0A0A" stroke="#262626" stroke-width="1" />
  <rect x="1" y="1" width="838" height="218" fill="url(#dotGrid)" />

  
  <g fill="#FFFFFF">
    <rect x="12" y="12" width="10" height="2" /><rect x="12" y="12" width="2" height="10" />
    <rect x="818" y="12" width="10" height="2" /><rect x="826" y="12" width="2" height="10" />
    <rect x="12" y="206" width="10" height="2" /><rect x="12" y="198" width="2" height="10" />
    <rect x="818" y="206" width="10" height="2" /><rect x="826" y="198" width="2" height="10" />
  </g>

  
  <g>
    <rect x="38" y="42" width="6" height="6" fill="#FFFFFF" class="blink" />
  </g>
  <text x="52" y="49" fill="#808080" font-size="11" letter-spacing="2" class="mono">SYS.ONLINE // SYLVERTHORN</text>

  <text x="36" y="102" fill="#FFFFFF" font-size="34" font-weight="700" letter-spacing="3" class="mono">KORICHI YANIS<tspan class="blink" fill="#A3A3A3">_</tspan></text>

  
  <g>
    <rect x="38" y="118" width="80" height="3" fill="#FFFFFF" />
    <rect x="122" y="118" width="60" height="3" fill="#A3A3A3" />
    <rect x="186" y="118" width="44" height="3" fill="#666666" />
    <rect x="234" y="118" width="24" height="3" fill="#404040" />
    <rect x="262" y="118" width="12" height="3" fill="#2A2A2A" />
    <rect x="278" y="118" width="6" height="3" fill="#262626" />
    <rect x="288" y="118" width="3" height="3" fill="#1F1F1F" />
  </g>

  
  <g>
    <rect x="38" y="138" width="98" height="24" fill="#141414" stroke="#333333" stroke-width="1" />
    <rect x="146" y="138" width="110" height="24" fill="#141414" stroke="#333333" stroke-width="1" />
    <rect x="266" y="138" width="90" height="24" fill="#141414" stroke="#333333" stroke-width="1" />
  </g>
  <text x="87" y="154" fill="#E5E5E5" font-size="11" letter-spacing="1.5" text-anchor="middle" class="mono">DEVELOPMENT</text>
  <text x="201" y="154" fill="#E5E5E5" font-size="11" letter-spacing="1.5" text-anchor="middle" class="mono">NETWORKING</text>
  <text x="311" y="154" fill="#E5E5E5" font-size="11" letter-spacing="1.5" text-anchor="middle" class="mono">SYSTEMS</text>

  <text x="38" y="188" fill="#525252" font-size="10" letter-spacing="1.8" class="mono">BUILD // ROUTE // AUTOMATE</text>

  
  <g>
    
    <rect x="582" y="66" width="69" height="2" fill="#2E2E2E" />
    <rect x="649" y="66" width="2" height="85" fill="#2E2E2E" />
    <rect x="649" y="101" width="69" height="2" fill="#2E2E2E" />
    <rect x="582" y="149" width="69" height="2" fill="#2E2E2E" />
    <rect x="649" y="115" width="69" height="2" fill="#2E2E2E" />
    
    <rect x="647" y="106" width="6" height="6" fill="#525252" />

    
    <rect x="582" y="64" width="6" height="6" fill="#FFFFFF" class="pkt-1" />
    <rect x="582" y="64" width="6" height="6" fill="#737373" class="pkt-3" />
    <rect x="710" y="113" width="6" height="6" fill="#D4D4D4" class="pkt-2" />

    
    <rect x="524" y="42" width="58" height="48" fill="#121212" stroke="#525252" stroke-width="2" />
    
    <rect x="530" y="49" width="46" height="9" fill="#1F1F1F" />
    <rect x="530" y="61" width="46" height="9" fill="#1F1F1F" />
    <rect x="530" y="73" width="46" height="9" fill="#1F1F1F" />
    
    <rect x="534" y="52" width="4" height="3" class="led-1" />
    <rect x="534" y="64" width="4" height="3" class="led-2" />
    <rect x="534" y="76" width="4" height="3" class="led-3" />
    
    <rect x="556" y="52" width="16" height="3" fill="#333333" />
    <rect x="556" y="64" width="16" height="3" fill="#333333" />
    <rect x="556" y="76" width="16" height="3" fill="#333333" />
    <text x="553" y="104" fill="#666666" font-size="9" letter-spacing="1" text-anchor="middle" class="mono">SYS.HOST</text>

    
    <rect x="524" y="128" width="58" height="44" fill="#121212" stroke="#525252" stroke-width="2" />
    <rect x="525" y="129" width="56" height="9" fill="#262626" />
    <rect x="529" y="132" width="3" height="3" fill="#A3A3A3" />
    <rect x="535" y="132" width="3" height="3" fill="#666666" />
    <rect x="541" y="132" width="3" height="3" fill="#404040" />
    
    <rect x="530" y="144" width="22" height="3" fill="#737373" />
    <rect x="530" y="151" width="32" height="3" fill="#D4D4D4" class="code-bar" />
    <rect x="530" y="158" width="16" height="3" fill="#525252" />
    <text x="553" y="186" fill="#666666" font-size="9" letter-spacing="1" text-anchor="middle" class="mono">DEV.TERM</text>

    
    
    <rect x="730" y="68" width="4" height="18" fill="#525252" />
    <rect x="730" y="64" width="4" height="4" fill="#FFFFFF" class="led-2" />
    <rect x="768" y="68" width="4" height="18" fill="#525252" />
    <rect x="768" y="64" width="4" height="4" fill="#FFFFFF" class="led-1" />
    
    <rect x="718" y="86" width="66" height="44" fill="#121212" stroke="#808080" stroke-width="2" />
    <rect x="724" y="94" width="54" height="6" fill="#1F1F1F" />
    
    <rect x="726" y="108" width="8" height="12" fill="#1F1F1F" stroke="#404040" stroke-width="1" />
    <rect x="739" y="108" width="8" height="12" fill="#1F1F1F" stroke="#404040" stroke-width="1" />
    <rect x="752" y="108" width="8" height="12" fill="#1F1F1F" stroke="#404040" stroke-width="1" />
    <rect x="765" y="108" width="8" height="12" fill="#1F1F1F" stroke="#404040" stroke-width="1" />
    <rect x="728" y="103" width="4" height="3" class="port-1" />
    <rect x="741" y="103" width="4" height="3" class="port-2" />
    <rect x="754" y="103" width="4" height="3" class="port-3" />
