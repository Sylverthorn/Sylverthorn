    <text x="751" y="145" fill="#666666" font-size="9" letter-spacing="1" text-anchor="middle" class="mono">NET.CORE</text>
  </g>

  
  <rect x="1" y="1" width="838" height="218" fill="url(#scanlines)" pointer-events="none" />
</svg>